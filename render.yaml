services:
  # 1. Backend API Service
  - type: web
    name: nexcore-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: consultant_utilization_dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "lax"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nexcore-backend-z808.onrender.com,http://localhost:3000,http://localhost:5000"

  # 2. Frontend Client Service
  - type: web
    name: nexcore-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: "https://nexcore-backend-z808.onrender.com"
      - key: NEXT_PUBLIC_API_URL
        value: "https://nexcore-backend-z808.onrender.com"

